name: PostgreSQL Chaos Audit

on:
  pull_request:
    branches: ["main"]

jobs:
  postgres-chaos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      CHAOS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/evix_test
      EVIX_CHAOS_RUNS: 600
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --test test/postgres-chaos.test.js
